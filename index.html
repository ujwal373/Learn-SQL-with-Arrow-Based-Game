<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QueryOut: a SQL learning game. Clear the arrows, finish the query." />
    <title>QueryOut</title>
    <script>
      // Sets the theme before the page paints, so there is no flash of the wrong colors.
      try {
        var saved = localStorage.getItem('queryout-theme')
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
